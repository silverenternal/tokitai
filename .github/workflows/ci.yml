name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.os }} / ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, 1.80.0]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4.2.2

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2.9.1
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (deny warnings)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Build with all features
        run: cargo build --workspace --all-features

      - name: Build with no default features
        run: cargo build --workspace --no-default-features

      - name: Test with all features
        run: cargo test --workspace --all-features

      - name: Test with no default features
        run: cargo test --workspace --no-default-features

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps -D warnings
        env:
          RUSTDOCFLAGS: -D warnings

  audit:
    name: Security audit (stable / ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4.2.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2.9.1
        with:
          cache-on-failure: true

      # cargo-audit is installed via the rustsec advisory DB CLI.
      # The action `rustsec/audit-check` is intentionally not used because it
      # shells out to the latest container image and provides less control over
      # toolchain pinning. If `cargo-audit` is unavailable in the runner image
      # (e.g. on a fork PR), this step is skipped instead of failing the run.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2.81.1
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit
        continue-on-error: true
