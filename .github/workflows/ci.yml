name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  # Pinned rustc version used to (re)generate trybuild UI snapshots in
  # tokitai-macros/tests/ui/*.stderr. The Makefile target
  # `refresh-ui-snapshots` reads the same variable so local re-blesses
  # match CI. Bump both in lockstep when the workspace adopts a new
  # compiler for snapshot generation.
  RUSTC_VERSION: "1.96.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.os }} / ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4.2.2

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2.7.5
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (deny warnings)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Build with all features
        run: cargo build --workspace --all-features

      - name: Build with no default features
        run: cargo build --workspace --no-default-features

      - name: Test with all features
        run: cargo test --workspace --all-features

      - name: Test with no default features
        run: cargo test --workspace --no-default-features

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  audit:
    name: Security audit (stable / ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4.2.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2.7.5
        with:
          cache-on-failure: true

      # cargo-audit is installed via the rustsec advisory DB CLI.
      # The action `rustsec/audit-check` is intentionally not used because it
      # shells out to the latest container image and provides less control over
      # toolchain pinning. If `cargo-audit` is unavailable in the runner image
      # (e.g. on a fork PR), this step is skipped instead of failing the run.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2.1.0
        with:
          tool: cargo-audit
        continue-on-error: true

      - name: Run cargo audit
        run: cargo audit
        continue-on-error: true

  ui-snapshot-audit:
    name: UI snapshot audit (stable / ubuntu)
    # T-009: pins the rustc version used to (re)generate trybuild snapshots
    # and verifies that every tokitai-macros/tests/ui/*.stderr has a
    # matching .rs fixture and that the RUSTC_VERSION sidecar at
    # tokitai-macros/tests/ui/RUSTC_VERSION is present. Failure here
    # means an orphan .stderr or a missing version stamp will break
    # downstream re-blesses. See scripts/audit-ui-snapshots.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4.2.2

      - name: Install Rust ${{ env.RUSTC_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTC_VERSION }}

      - name: Audit trybuild UI snapshots
        run: bash scripts/audit-ui-snapshots.sh
        env:
          RUSTC_VERSION: ${{ env.RUSTC_VERSION }}

  per-impl-profile:
    # T-011: build a representative consumer crate with
    # `TOKITAI_PROFILE=1`, scrape the per-impl `cargo:warning=impl`
    # lines the macro emits, and capture the per-impl median as an
    # artifact. We do not gate the build on a >20% regression
    # yet (no baseline has been established); instead we just
    # upload the artifact so the regression-detection logic can
    # be enabled once we have a few green runs to learn the
    # baseline distribution from.
    name: Per-impl profile (stable / ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4.2.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2.7.5
        with:
          cache-on-failure: true

      - name: Build examples with profiling
        env:
          TOKITAI_PROFILE: "1"
        run: |
          set -euo pipefail
          cargo build --workspace --all-features --examples
          # Collect the per-impl profile lines into a stable text
          # artifact. The `cargo:warning=impl ` prefix is what the
          # macro emits; we strip the cargo formatter prefix to
          # produce one `<Type> <us>` tuple per line.
          cargo build --workspace --all-features --examples 2>&1 \
            | grep -E 'cargo:warning=impl ' \
            | sed -E 's|.*cargo:warning=impl ([^ ]+) -> ([0-9]+) tools, ms=([0-9]+).*|\1 \2 \3|' \
            | sort > profile-baseline.txt
          echo "## per-impl profile baseline" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat profile-baseline.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ ! -s profile-baseline.txt ]; then
            echo "::error::profile-baseline.txt is empty; the macro is not emitting cargo:warning=impl lines"
            exit 1
          fi

      - name: Upload profile artifact
        uses: actions/upload-artifact@v4.4.0
        with:
          name: per-impl-profile
          path: profile-baseline.txt
          if-no-files-found: error
