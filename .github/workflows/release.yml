name: Release

on:
  push:
    tags: ['v*.*.*']

env:
  CARGO_TERM_COLOR: always
  # Crates that must be published to crates.io before `tokitai`/`tokitai-mcp-server`.
  # Order matters: each entry depends on the previous one. Must be a JSON array
  # because the publish job parses it with `${{ fromJson(env.CRATES_PUBLISH_ORDER) }}`.
  CRATES_PUBLISH_ORDER: '["tokitai-core", "tokitai-macros", "tokitai", "tokitai-mcp-server"]'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag matches workspace version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4.2.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Verify tag matches Cargo.toml version
        run: |
          set -euo pipefail
          # The tag is the source of truth; strip the leading "v" to get the
          # expected version (e.g. "v0.4.0" -> "0.4.0").
          expected="${GITHUB_REF_NAME#v}"

          # Pick a single workspace member whose version we will compare
          # against the tag. `tokitai-core` is the leaf crate and is always
          # published first, so its version is a good proxy.
          manifest_version=$(cargo pkgid -p tokitai-core --manifest-path tokitai-core/Cargo.toml \
            | sed -E 's#^.*/##')

          echo "Tag version:      ${expected}"
          echo "Cargo.toml says:  ${manifest_version}"

          if [ "${expected}" != "${manifest_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match tokitai-core ${manifest_version}"
            exit 1
          fi

          # Also verify every workspace member agrees on the same version.
          mismatches=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | "\(.name)=\(.version)"' \
            | awk -F= -v want="${expected}" '$2 != want { print $0 }')
          if [ -n "${mismatches}" ]; then
            echo "::error::Workspace members are not all at version ${expected}:"
            echo "${mismatches}"
            exit 1
          fi

  test:
    name: Pre-release checks (test, clippy, fmt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4.2.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2.7.5
        with:
          cache-on-failure: true

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo doc --no-deps
        run: cargo doc --workspace --no-deps

  publish:

  publish:
    name: Publish ${{ matrix.crate }}
    needs: [validate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJson(env.CRATES_PUBLISH_ORDER) }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4.2.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2.7.5
        with:
          cache-on-failure: true

      # We trust the validated tag, so we skip `cargo publish`'s
      # local re-verification and the git-tag dirty checks.
      # crates.io has a short propagation delay between consecutive
      # publishes; the sleep below keeps the matrix jobs in sync.
      - name: Publish ${{ matrix.crate }} to crates.io
        run: |
          set -euo pipefail
          echo "Publishing ${{ matrix.crate }}..."
          cargo publish \
            -p ${{ matrix.crate }} \
            --no-verify \
            --token "${CARGO_REGISTRY_TOKEN}"
          echo "Published ${{ matrix.crate }}. Sleeping 60s for crates.io propagation..."
          sleep 60
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Extract CHANGELOG section
        id: changelog
        run: |
          set -euo pipefail
          # Use the previous v* tag as the lower bound; the current tag is
          # the upper bound. If no previous tag exists, fall back to the
          # full CHANGELOG.md so the release body is never empty.
          current_tag="${GITHUB_REF_NAME}"
          previous_tag=$(git tag --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^${current_tag}$" \
            | head -n 1 || true)

          if [ -n "${previous_tag}" ]; then
            echo "Extracting section between ${previous_tag} and ${current_tag}"
            body=$(awk -v current="${current_tag}" -v previous="${previous_tag}" '
              BEGIN { keep = 0 }
              /^## \[/ {
                if (keep) { exit }
                if (index($0, current))  { keep = 1 }
                else if (index($0, previous)) { keep = 0 }
                else if (keep)            { keep = 0 }
                next
              }
              keep { print }
            ' CHANGELOG.md | sed -e '$a\' )
          else
            echo "No previous tag found; attaching full CHANGELOG.md"
            body=$(cat CHANGELOG.md)
          fi

          if [ -z "${body// }" ]; then
            body="Release ${current_tag}. See CHANGELOG.md for details."
          fi

          printf '%s\n' "${body}" > changelog-section.md
          echo "changelog_file=changelog-section.md" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2.2.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.changelog_file }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            CHANGELOG.md
