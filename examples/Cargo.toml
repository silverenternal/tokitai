[package]
name = "tokitai-examples"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokitai = { path = "../tokitai", features = ["http-server"] }
tokitai-core = { path = "../tokitai-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
chrono = "0.4"
dotenv = "0.15"
sha2 = "0.10"
hex = "0.4"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Console"] }

[[example]]
name = "basic_usage"
path = "basic_usage.rs"

[[example]]
name = "ollama_integration"
path = "ollama_integration.rs"

[[example]]
name = "multi_tool_chat"
path = "multi_tool_chat.rs"

[[example]]
name = "advanced_types"
path = "advanced_types.rs"

[[example]]
name = "param_attrs"
path = "param_attrs.rs"

[[example]]
name = "validate_transform_alias"
path = "validate_transform_alias.rs"

[[example]]
name = "debug_tools"
path = "debug_tools.rs"

[[example]]
name = "mcp_server_demo"
path = "mcp_server_demo.rs"

[[example]]
name = "mcp_http_server"
path = "mcp_http_server.rs"
