[package]
name = "tokitai-examples"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokitai = { path = "../tokitai" }
tokitai-core = { path = "../tokitai-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
chrono = "0.4"
dotenv = "0.15"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Console"] }

[[example]]
name = "basic_usage"
path = "basic_usage.rs"

