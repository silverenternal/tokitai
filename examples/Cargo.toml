[package]
name = "tokitai-examples"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokitai = { path = "../tokitai" }
tokitai-core = { path = "../tokitai-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
chrono = "0.4"
dotenv = "0.15"

[[example]]
name = "basic_usage"
path = "basic_usage.rs"

[[example]]
name = "ollama_integration"
path = "ollama_integration.rs"

[[example]]
name = "multi_tool_chat"
path = "multi_tool_chat.rs"
