[project]
name = "tokitai-client"
version = "0.1.0"
description = "Minimal async client for Tokitai MCP-compatible HTTP servers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [
    { name = "Tokitai contributors" },
]
keywords = ["tokitai", "mcp", "ai", "llm", "tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
socks = ["httpx[socks]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["tokitai_client"]
