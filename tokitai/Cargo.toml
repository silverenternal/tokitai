[package]
name = "tokitai"
version = "0.5.1"
edition = "2021"
authors = ["silverenternal <3147264070@qq.com>"]
license = "MIT OR Apache-2.0"
description = "Tokitai - AI tool integration system with compile-time tool definitions"
documentation = "https://docs.rs/tokitai"
repository = "https://github.com/silverenternal/tokitai"
homepage = "https://github.com/silverenternal/tokitai"
keywords = ["ai", "llm", "tool-calling", "function-calling", "proc-macro"]
categories = ["development-tools", "asynchronous"]
rust-version = "1.80"

[dependencies]
# Core types (zero dependencies)
tokitai-core = { path = "../tokitai-core", version = "0.5.1" }

# Procedural macros
tokitai-macros = { path = "../tokitai-macros", version = "0.5.1" }

# Serialisation (optional, enabled by default)
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

# Error handling (required at runtime)
thiserror = "1.0"

# Logging
log = { version = "0.4", optional = true }

# Async runtime (optional)
async-trait = { version = "0.1", optional = true }

# HTTP server (optional, for the MCP HTTP transport)
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["cors", "trace"], optional = true }
# T-015: tracing runtime. Used by the `trace` feature below
# to power the `#[tracing::instrument]` spans the macro emits
# on every generated `__call_*` wrapper. We depend on `tracing`
# here so consumers that enable `trace` do not need to add
# their own `tracing` dependency — the macro emits
# `#[tracing::instrument(...)]` whose resolution requires
# the crate to be in the consumer's dependency graph.
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[features]
# Serde is enabled by default for an out-of-the-box experience
# Users who need the minimum dependency footprint can use default-features = false
default = ["serde"]

# std: enables serde support
std = ["tokitai-core/serde", "dep:serde", "dep:serde_json"]

# serde: serde support (enabled by default)
serde = ["tokitai-core/serde", "dep:serde", "dep:serde_json"]

# runtime: async runtime support
runtime = ["std", "async-trait", "log"]

# mcp: MCP protocol support
mcp = ["runtime"]

# http-server: HTTP server support (for MCP HTTP)
http-server = ["mcp", "axum", "tokio", "tower", "tower-http", "tracing", "tracing-subscriber"]

# T-015: in-process tool-call trace emitter. When enabled, the
# `#[tool]` macro generates `#[tracing::instrument]` spans
# around every `__call_*` wrapper carrying `tool.name`,
# `tool.version`, `args.size`, and `result.size` fields. When
# disabled (the default), the macro emits no `tracing`
# references anywhere in the generated code; the binary-size
# delta is exactly zero. Enable with:
#
#     tokitai = { version = "0.5", features = ["trace"] }
#
# ...or via the compile-time env var `TOKITAI_TRACE=1` (also
# picked up by the macro via `option_env!`). The env-var path
# requires the consumer to add their own `tracing` dependency;
# the feature-flag path does not.
trace = ["tracing"]

# llm-live: enables live integration tests against a local Ollama instance
# in `provider_envelope_test.rs`. Off by default; CI does not enable it.
# Use: `cargo test -p tokitai --test provider_envelope_test --features llm-live`
llm-live = []

# Advanced usage:
# 1. Macro-only (truly zero dependencies): tokitai = { version = "0.5.1", default-features = false }
#    - Use only the #[tool] macro and provide your own runtime
# 2. Default configuration (recommended): tokitai = "0.5.1"
#    - Includes serde + serde_json, ready to go
# 3. Full feature set: tokitai = { version = "0.5.1", features = ["http-server"] }
#    - Includes the MCP HTTP server

[dev-dependencies]
tokitai-core = { path = "../tokitai-core", version = "0.5.1", features = ["serde"] }
trybuild = "1.0"
# T-015: tests for the `trace` feature need `tracing` and
# `tracing-subscriber` to attach a span recorder. These are
# dev-only because the test crate is the one that needs to
# observe emitted spans; the consumer crate never needs a
# subscriber to use the feature.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
