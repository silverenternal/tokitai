[package]
name = "tokitai"
version = "0.5.1"
edition = "2021"
authors = ["silverenternal <3147264070@qq.com>"]
license = "MIT OR Apache-2.0"
description = "Tokitai - AI tool integration system with compile-time tool definitions"
documentation = "https://docs.rs/tokitai"
repository = "https://github.com/silverenternal/tokitai"
homepage = "https://github.com/silverenternal/tokitai"
keywords = ["ai", "llm", "tool-calling", "function-calling", "proc-macro"]
categories = ["development-tools", "asynchronous"]
rust-version = "1.80"

[dependencies]
# Core types (zero dependencies)
tokitai-core = { path = "../tokitai-core", version = "0.5.1" }

# Procedural macros
tokitai-macros = { path = "../tokitai-macros", version = "0.5.1" }

# Serialisation (optional, enabled by default)
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

# Error handling (required at runtime)
thiserror = "1.0"

# Logging
log = { version = "0.4", optional = true }

# Async runtime (optional)
async-trait = { version = "0.1", optional = true }

# HTTP server (optional, for the MCP HTTP transport)
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["cors", "trace"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[features]
# Serde is enabled by default for an out-of-the-box experience
# Users who need the minimum dependency footprint can use default-features = false
default = ["serde"]

# std: enables serde support
std = ["tokitai-core/serde", "dep:serde", "dep:serde_json"]

# serde: serde support (enabled by default)
serde = ["tokitai-core/serde", "dep:serde", "dep:serde_json"]

# runtime: async runtime support
runtime = ["std", "async-trait", "log"]

# mcp: MCP protocol support
mcp = ["runtime"]

# http-server: HTTP server support (for MCP HTTP)
http-server = ["mcp", "axum", "tokio", "tower", "tower-http", "tracing", "tracing-subscriber"]

# Advanced usage:
# 1. Macro-only (truly zero dependencies): tokitai = { version = "0.5.1", default-features = false }
#    - Use only the #[tool] macro and provide your own runtime
# 2. Default configuration (recommended): tokitai = "0.5.1"
#    - Includes serde + serde_json, ready to go
# 3. Full feature set: tokitai = { version = "0.5.1", features = ["http-server"] }
#    - Includes the MCP HTTP server

[dev-dependencies]
tokitai-core = { path = "../tokitai-core", version = "0.5.1", features = ["serde"] }
trybuild = "1.0"
