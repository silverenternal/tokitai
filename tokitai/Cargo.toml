[package]
name = "tokitai"
version = "0.4.0"
edition = "2021"
authors = ["silverenternal <3147264070@qq.com>"]
license = "MIT OR Apache-2.0"
description = "Tokitai - AI tool integration system with compile-time tool definitions"
documentation = "https://docs.rs/tokitai"
repository = "https://github.com/silverenternal/tokitai"
homepage = "https://github.com/silverenternal/tokitai"
keywords = ["ai", "llm", "tool-calling", "function-calling", "proc-macro"]
categories = ["development-tools", "asynchronous"]
rust-version = "1.80"

[dependencies]
# 核心类型（零依赖）
tokitai-core = { path = "../tokitai-core", version = "0.4.0" }

# 宏
tokitai-macros = { path = "../tokitai-macros", version = "0.4.0" }

# 序列化（可选，默认启用）
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

# 错误处理（runtime 必需）
thiserror = "1.0"

# 日志
log = { version = "0.4", optional = true }

# 异步运行时（可选）
async-trait = { version = "0.1", optional = true }

# HTTP 服务器（可选，用于 MCP HTTP）
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["cors", "trace"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[features]
# 默认启用 serde 支持，开箱即用
# 需要最小依赖的用户可以使用 default-features = false
default = ["serde"]

# std: 启用 serde 支持
std = ["tokitai-core/serde", "dep:serde", "dep:serde_json"]

# serde: serde 支持（默认启用）
serde = ["tokitai-core/serde", "dep:serde", "dep:serde_json"]

# runtime: 异步运行时支持
runtime = ["std", "async-trait", "log"]

# async: 异步执行器支持（带线程池）
async = ["runtime", "tokitai-core/async", "tokio"]

# mcp: MCP 协议支持
mcp = ["runtime"]

# http-server: HTTP 服务器支持（用于 MCP HTTP）
http-server = ["mcp", "axum", "tokio", "tower", "tower-http", "tracing", "tracing-subscriber"]

# 高级用法：
# 1. 只用宏（真正的零依赖）: tokitai = { version = "0.4.0", default-features = false }
#    - 只使用 #[tool] 宏，运行时自己处理
# 2. 默认配置（推荐）: tokitai = "0.4.0"
#    - 包含 serde + serde_json，开箱即用
# 3. 完整功能：tokitai = { version = "0.4.0", features = ["http-server"] }
#    - 包含 MCP HTTP 服务器

[dev-dependencies]
tokitai-core = { path = "../tokitai-core", version = "0.4.0", features = ["serde"] }
trybuild = "1.0"
