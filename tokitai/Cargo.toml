[package]
name = "tokitai"
version = "0.3.0"
edition = "2021"
authors = ["silverenternal <3147264070@qq.com>"]
license = "MIT"
description = "Tokitai - AI tool integration system with compile-time tool definitions"
documentation = "https://docs.rs/tokitai"
repository = "https://github.com/silverenternal/tokitai"
homepage = "https://github.com/silverenternal/tokitai"
keywords = ["ai", "mcp", "automation", "tool", "macro"]
categories = ["development-tools"]
rust-version = "1.70"

[dependencies]
# 核心类型（零依赖）
tokitai-core = { path = "../tokitai-core", version = "0.3.0", features = ["serde"] }

# 宏
tokitai-macros = { path = "../tokitai-macros", version = "0.3.0" }

# 序列化（runtime 必需）
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

# 错误处理（runtime 可选）
thiserror = { version = "1.0", optional = true }

# 日志
log = { version = "0.4", optional = true }

[features]
default = ["runtime"]
# 基础运行时支持
runtime = ["serde", "serde_json", "thiserror", "log"]
# MCP 协议支持（需要 runtime）
mcp = ["runtime"]

[dev-dependencies]
tokitai-core = { path = "../tokitai-core", version = "0.3.0", default-features = false }
trybuild = "1.0"
