[package]
name = "tokitai-macros"
version = "0.6.1"
edition = "2021"
authors = ["silverenternal <3147264070@qq.com>"]
license = "MIT OR Apache-2.0"
description = "Procedural macros for Tokitai - Zero-dependency macro for AI tool integration"
documentation = "https://docs.rs/tokitai-macros"
repository = "https://github.com/silverenternal/tokitai"
homepage = "https://github.com/silverenternal/tokitai"
keywords = ["ai", "llm", "tool-calling", "function-calling", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers"]
rust-version = "1.80"
build = "build.rs"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
phf = { version = "0.11", features = ["macros"] }
# T-020: parse `since = "..."` / `until = "..."` literals at
# macro time and enforce ordered SemVer comparisons when the
# user opts into `version_policy = "semver"`. We use the
# canonical `semver` crate so the ordering rules match the
# rest of the Rust ecosystem (SemVer 2.0 + pre-release
# ordering, build metadata ignored for comparison). The crate
# is only used at macro-expansion time, so it has zero
# impact on the consumer's binary size.
semver = "1.0"
# T-015: the macro emits `#[tracing::instrument(...)]` as a
# string template inside `quote!`. The attribute is parsed by
# `tracing`'s own proc-macro at the *consumer* site, not by
# `tokitai-macros`. Therefore `tokitai-macros` does NOT need a
# `tracing` dependency: the only thing it does is emit
# attribute tokens that reference `::tracing::Span::current()`
# (also resolved at the consumer site). Consumers that enable
# the trace feature must add their own `tracing` dependency
# (the user-facing `tokitai` crate re-exports it behind the
# `trace` feature so most consumers do not need to touch
# Cargo.toml).

[dev-dependencies]
tokitai = { path = "../tokitai", features = ["serde"] }
tokitai-core = { path = "../tokitai-core", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
trybuild = "1.0"
tokio = { version = "1.0", features = ["full"] }
criterion = "0.5"
proptest = "1.5"
syn = { version = "2.0", features = ["full"] }
proc-macro2 = "1.0"
quote = "1.0"
# T-015: tests need `tracing` available because the macro
# emits `tracing::Span::current().record(...)` calls when
# `TOKITAI_TRACE=1` is forwarded. We re-export the same
# version the user-facing `tokitai` crate uses to keep the
# dep graph consistent.
tracing = "0.1"

[features]
serde = []
# Tokio executor: when enabled, the macro-generated sync-from-async path will
# use `tokio::runtime::Handle::block_on` to drive the future. Disable this
# (`default-features = false` and omit `tokio`) on runtimes such as
# `async-std` or `smol`; in that case you MUST register a custom
# `tokitai_core::AsyncExecutor` via `set_async_executor(...)`.
tokio = []
# T-015: marker feature. When a downstream consumer enables
# `tokitai = { features = ["trace"] }`, this feature lights
# up in `tokitai-macros`'s build env (via the
# `tokitai-macros/trace` cascade in `tokitai/Cargo.toml`).
# `build.rs` detects `CARGO_FEATURE_TRACE=1` and forwards
# `TOKITAI_TRACE=1` to the macro's compile environment, which
# in turn makes `option_env!("TOKITAI_TRACE")` resolve to
# `Some("1")` and causes the macro to emit
# `#[tracing::instrument(...)]` on every generated `__call_*`
# wrapper. The proc-macro crate itself needs no `tracing`
# dependency because the attribute is resolved at the
# consumer site; this feature exists purely so the
# build-script can detect the consumer's intent.
trace = []

[[bench]]
name = "macro_bench"
harness = false
