[package]
name = "tokitai-macros"
version = "0.5.1"
edition = "2021"
authors = ["silverenternal <3147264070@qq.com>"]
license = "MIT OR Apache-2.0"
description = "Procedural macros for Tokitai - Zero-dependency macro for AI tool integration"
documentation = "https://docs.rs/tokitai-macros"
repository = "https://github.com/silverenternal/tokitai"
homepage = "https://github.com/silverenternal/tokitai"
keywords = ["ai", "llm", "tool-calling", "function-calling", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers"]
rust-version = "1.80"
build = "build.rs"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
phf = { version = "0.11", features = ["macros"] }
# T-015: the macro emits `#[tracing::instrument(...)]` as a
# string template inside `quote!`. The attribute is parsed by
# `tracing`'s own proc-macro at the *consumer* site, not by
# `tokitai-macros`. Therefore `tokitai-macros` does NOT need a
# `tracing` dependency: the only thing it does is emit
# attribute tokens that reference `::tracing::Span::current()`
# (also resolved at the consumer site). Consumers that enable
# the trace feature must add their own `tracing` dependency
# (the user-facing `tokitai` crate re-exports it behind the
# `trace` feature so most consumers do not need to touch
# Cargo.toml).

[dev-dependencies]
tokitai = { path = "../tokitai", features = ["serde"] }
tokitai-core = { path = "../tokitai-core", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
trybuild = "1.0"
tokio = { version = "1.0", features = ["full"] }
criterion = "0.5"
proptest = "1.5"
syn = { version = "2.0", features = ["full"] }
proc-macro2 = "1.0"
quote = "1.0"
# T-015: tests need `tracing` available because the macro
# emits `tracing::Span::current().record(...)` calls when
# `TOKITAI_TRACE=1` is forwarded. We re-export the same
# version the user-facing `tokitai` crate uses to keep the
# dep graph consistent.
tracing = "0.1"

[features]
serde = []
# Tokio executor: when enabled, the macro-generated sync-from-async path will
# use `tokio::runtime::Handle::block_on` to drive the future. Disable this
# (`default-features = false` and omit `tokio`) on runtimes such as
# `async-std` or `smol`; in that case you MUST register a custom
# `tokitai_core::AsyncExecutor` via `set_async_executor(...)`.
tokio = []

[[bench]]
name = "macro_bench"
harness = false
