[workspace]
members = [
    "tokitai-core",
    "tokitai-macros",
    "tokitai",
    "tokitai-mcp-server",
    "examples",
    "examples/database_tool",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/silverenternal/tokitai"

# Release build configuration
# Enable LTO (link-time optimization) and code generation optimizations, improving runtime performance by 10-15%
[profile.release]
lto = "thin"          # Thin LTO, balance between compile time and performance
codegen-units = 1     # Single code generation unit, better optimization
strip = "debuginfo"   # Strip debug symbols, reduce binary size

# Macro crate specific optimization - compile-time code generation intensive
[profile.release.package.tokitai-macros]
opt-level = 3         # Highest optimization level, speed up macro generation
