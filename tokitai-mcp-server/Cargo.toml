[package]
name = "tokitai-mcp-server"
version = "0.5.1"
edition = "2021"
authors = ["silverenternal <3147264070@qq.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/silverenternal/tokitai"
homepage = "https://github.com/silverenternal/tokitai"
documentation = "https://docs.rs/tokitai-mcp-server"
description = "MCP server scaffolding for Tokitai - Build AI-callable tool servers with zero runtime overhead"
keywords = ["mcp", "ai", "llm", "tool", "server"]
categories = ["development-tools", "asynchronous"]
rust-version = "1.80"

[dependencies]
tokitai = { path = "../tokitai", version = "0.5.1", features = ["mcp", "http-server"] }
tokitai-core = { path = "../tokitai-core", version = "0.5.1", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"

[dev-dependencies]
tokitai-core = { path = "../tokitai-core", version = "0.5.1", features = ["serde"] }
tower = { version = "0.4", features = ["util"] }

[features]
default = []
