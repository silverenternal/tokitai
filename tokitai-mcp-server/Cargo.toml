[package]
name = "tokitai-mcp-server"
version = "0.6.0"
edition = "2021"
authors = ["silverenternal <3147264070@qq.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/silverenternal/tokitai"
homepage = "https://github.com/silverenternal/tokitai"
documentation = "https://docs.rs/tokitai-mcp-server"
description = "MCP server scaffolding for Tokitai - Build AI-callable tool servers with zero runtime overhead"
keywords = ["mcp", "ai", "llm", "tool", "server"]
categories = ["development-tools", "asynchronous"]
rust-version = "1.80"
# T-024: build script emits `OUT_DIR/tokitai_manifest.rs` carrying
# the resolved `tokitai-core` version the server was compiled
# against. The runtime `serve()` entry point reads this constant
# to enforce `--require-tokitai=<prefix>` at startup. See
# `build.rs` for the manifest format.
build = "build.rs"

[dependencies]
tokitai = { path = "../tokitai", version = "0.6.0", features = ["mcp", "http-server"] }
tokitai-core = { path = "../tokitai-core", version = "0.6.0", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"

[dev-dependencies]
tokitai-core = { path = "../tokitai-core", version = "0.6.0", features = ["serde"] }
tower = { version = "0.4", features = ["util"] }

[[example]]
name = "mcp_stdio_server"
path = "examples/mcp_stdio_server.rs"

[features]
default = []
# T-021: opt-in typed MCP handle layer. When enabled, every tool listed
# in the `tools/list` response is wrapped by a runtime JSON-Schema
# validator. Malformed calls (wrong type, missing field, extra field,
# out-of-range number, etc.) are refused with `ToolError::ValidationError`
# BEFORE the call reaches the handler. This is the defense-in-depth
# against the CVE-2025-59377 class of MCP vulnerabilities
# (shell-injection sinks in handler implementations).
#
# Without this feature the JSON-passthrough path from T-005 is used;
# no behavior change, no extra validation.
mcp-typed = []
